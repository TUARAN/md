name = "md-gnews-proxy"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Plain-text vars (dashboard or --var): comma-separated origins, or "*" for any origin.
[vars]
ALLOWED_ORIGINS = "https://syncblog.cn,https://md.tuaran666.workers.dev"

# Optional secrets — used when the client does not provide `apikey`.
# `wrangler secret put GNEWS_API_KEY`
# `wrangler secret put NEWSAPI_API_KEY`
# `wrangler secret put MEDIASTACK_API_KEY`
# `wrangler secret put GUARDIAN_API_KEY`
# `wrangler secret put CURRENTS_API_KEY`
