<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="keywords" content="Syncblog,博主联盟,一文多发,多平台同步,内容同步,Markdown,分发,工作流" />
    <meta name="description" content="Syncblog · 一文多发，30分钟完成30+平台同步。Markdown 编辑与多端内容分发。" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Syncblog · 一文多发，30分钟完成30+平台同步</title>
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon-precomposed" href="/favicon.png" />
    <style>
      /**
       * Inline splash —— HTML 解析完就显示,无需等 Vue 加载完。
       * Vue `app.mount('#app')` 会替换掉 #app 的内容,自动把 splash 移除。
       * 注意:这里是真正且唯一的 splash。不要在 Vue 组件里再画一个 — 那样会
       * 在 Vue 挂载瞬间出现"两个 splash"(inline → Vue,视觉不连续)。
       */
      .loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        background-color: #ffffff;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        user-select: none;
      }

      .loading .splash-title {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #141414;
      }

      .loading .splash-slogan {
        margin: 0;
        max-width: 26rem;
        padding: 0 1rem;
        text-align: center;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5;
        color: #6b7280;
      }

      .loading.dark {
        background-color: #141414;
      }

      .loading.dark .splash-title {
        color: #ffffff;
      }

      .loading.dark .splash-slogan {
        color: #a1a1aa;
      }

      .loading .timeout-tip {
        position: absolute;
        bottom: 8%;
      }

      @media (max-width: 640px) {
        .loading-logo {
          width: 88px;
          height: 88px;
        }
        .loading .splash-title {
          font-size: 1.35rem;
        }
        .loading .splash-slogan {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <div id="app">
      <div class="loading">
        <img src="/src/assets/images/favicon.png" alt="" class="loading-logo" />
        <strong class="splash-title">Syncblog</strong>
        <p class="splash-slogan">30 分钟分发 30+ 平台</p>
        <p class="timeout-tip" style="display: none; color: #e53935; font-size: 14px">
          加载时间过长，请尝试刷新页面或按 F12 查看控制台是否有异常信息
        </p>
      </div>
    </div>
    <script>
      const theme = localStorage.getItem('vueuse-color-scheme')
      if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('.loading').classList.add('dark')
      }

      setTimeout(() => {
        const tip = document.querySelector('.loading .timeout-tip')
        if (tip) {
          tip.style.display = 'block'
        }
      }, 30000)
    </script>
    <script>
      window.MathJax = {
        tex: { tags: 'ams' },
        svg: { fontCache: 'none' },
      }
    </script>
    <script
      id="MathJax-script"
      src="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/npm/mathjax@3/es5/tex-svg.js"
    ></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
