name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test distribution plugin
        run: pnpm test:distribution-plugin

      - name: Lint distribution plugin
        run: pnpm exec eslint 'apps/distribution-extension/master/**/*.js' 'apps/distribution-extension/tests/**/*.mjs' --no-fix

      - name: Type check
        run: pnpm type-check

      - name: Build web
        run: pnpm web build

      # Distribution ZIPs stay in private R2; never publish them as CI artifacts.
